[package]
name = "kafkaoxide-app"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kafkaoxide-core = { workspace = true }
kafkaoxide-db = { workspace = true }
kafkaoxide-kafka = { workspace = true }
kafkaoxide-avro = { workspace = true }
kafkaoxide-schema-registry = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
error-stack = { workspace = true }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
base64 = "0.22"

# Backs `commands::system::trim_process_memory` — trims the OS-visible
# working set after "Clear memory" is clicked, since neither the JS heap
# nor Rust's default allocator eagerly return freed pages to the OS on
# their own. Windows-only: that's the only platform where this was reported
# (Task Manager's "Memory" column specifically reflects the working set).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading", "Win32_Foundation"] }
