# A single-node KRaft broker with SASL/PLAIN authentication and Kafka's own
# authorizer, used only by `backend/kafka/tests/publish_authorization.rs`.
#
# Mounted into the apache/kafka image rather than configured through `KAFKA_*`
# environment variables: the image's env-to-property conversion mangles
# underscores (`_` becomes `.`, `__` becomes `_`), which makes
# `listener.name.sasl_plaintext.plain.sasl.jaas.config` — the property that
# defines the users — both unreadable and easy to get silently wrong.
#
# Three principals, and the difference between them is the whole point:
#   admin  — a super user, used only to create the topic and the ACLs
#   writer — Describe + Read + Write on the test topic
#   reader — Describe + Read only, and so must never be able to publish
node.id=1
process.roles=broker,controller
controller.quorum.voters=1@localhost:9093

# 9192 inside the container as well as outside, and mapped 9192:9192 by
# `scripts/e2e-acl-fixtures.sh`, so that `localhost:9192` below resolves to this
# broker from *both* sides. Clients reconnect to whatever a broker advertises,
# so a single advertised address has to be true in both places: the test process
# on the host, and the CLI tools the fixture script runs inside the container to
# create the topic and its ACLs.
listeners=SASL_PLAINTEXT://:9192,CONTROLLER://:9093
advertised.listeners=SASL_PLAINTEXT://localhost:9192
listener.security.protocol.map=CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT
inter.broker.listener.name=SASL_PLAINTEXT
controller.listener.names=CONTROLLER

sasl.enabled.mechanisms=PLAIN
sasl.mechanism.inter.broker.protocol=PLAIN
listener.name.sasl_plaintext.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret" user_admin="admin-secret" user_writer="writer-secret" user_reader="reader-secret";

# Without an authorizer every principal is implicitly allowed everything, and
# the test would pass for the wrong reason.
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
# `User:ANONYMOUS` is here because the CONTROLLER listener is PLAINTEXT, so this
# node's own controller/broker registration arrives unauthenticated — and under
# `allow.everyone.if.no.acl.found=false` a non-super ANONYMOUS cannot even
# register itself, so the broker never finishes starting.
#
# It does not weaken what this fixture tests: the only listener a client can
# reach is SASL_PLAINTEXT, which requires a successful PLAIN handshake, so no
# client is ever ANONYMOUS. The `reader` principal is still subject to every ACL
# below.
super.users=User:admin;User:ANONYMOUS
# The line that makes this a deny-by-default cluster: with it left at the
# default `true`, a topic with no ACLs at all is writable by anyone.
allow.everyone.if.no.acl.found=false

log.dirs=/tmp/kraft-combined-logs
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
num.partitions=3
