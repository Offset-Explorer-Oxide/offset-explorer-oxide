name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
      should_release: ${{ steps.check_tag.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from tauri.conf.json
        id: get_version
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          TAG="app-v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check if release tag already exists
        id: check_tag
        env:
          TAG: ${{ steps.get_version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists on origin — skipping release build (bump the version in src-tauri/tauri.conf.json to trigger a new release)."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} does not exist yet — will build and release."
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev

      - name: Verify CMake is available (Windows / rdkafka cmake-build)
        if: matrix.platform == 'windows-latest'
        run: cmake --version

      # librdkafka's CMake build (used only on Windows) locates zstd via
      # `find_package(ZSTD)`, which rdkafka-sys's build script wires up only
      # through `register_dep` — unlike other optional deps in that same
      # build script (e.g. sasl2/gssapi), it doesn't also push explicit
      # include/lib paths, and in practice find_package doesn't locate the
      # Cargo-built zstd-sys library on this runner. Result: the CMake build
      # silently proceeds with zstd disabled instead of failing loudly
      # (confirmed by extracting a built app-v0.27.0 release and finding
      # `rd_kafka_zstd_decompress` present in the macOS build but absent from
      # the Windows one). Installing zstd via vcpkg (already present on
      # windows-latest runners) and pointing CMAKE_PREFIX_PATH at it gives
      # find_package a real library to locate, sidestepping the rdkafka-sys
      # wiring gap entirely. The static triplet keeps zstd statically linked
      # into the final binary, so end users still need nothing extra.
      # `>> $env:GITHUB_ENV` in PowerShell writes UTF-16LE (Out-File's
      # default encoding), but the runner parses that file as UTF-8 — the
      # write "succeeds" with no error, but the variable silently never
      # reaches later steps. This is why v0.34.0 still shipped without zstd
      # despite this step showing green. Add-Content defaults to UTF-8
      # (no BOM) in PowerShell 7+ (pwsh, what `shell: pwsh` runs), which is
      # what actually works here.
      - name: Install zstd via vcpkg (Windows / rdkafka cmake-build zstd support)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          vcpkg install zstd:x64-windows-static
          Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static"

      # This exact zstd-on-Windows fix has silently failed multiple times
      # before (v0.27.0's Cargo feature alone; v0.34.0's vcpkg step whose
      # $env:GITHUB_ENV write turned out not to propagate; v0.35.0's fix of
      # that, which STILL shipped without zstd for a reason not yet
      # identified) — every time the build reported success and only a
      # binary-level check after release revealed zstd (and, it turns out,
      # Snappy too — never wired up for this CMake path at all, unrelated to
      # zstd's issues) was still missing. A local CMake build with the same
      # defines (on Linux, using GCC) correctly enables both, so the
      # generation logic itself is sound — something specific to the actual
      # Windows/MSVC execution of it isn't behaving the same way, and static
      # reading of the CMake scripts can't reveal what. So: build the crate
      # for real right here, find librdkafka's own generated config.h under
      # target/, and fail loudly printing its content if either codec isn't
      # really enabled — direct evidence from the real environment instead
      # of another guess.
      - name: Verify librdkafka's generated config.h actually enables zstd and Snappy (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          cargo build --release -p kafkaoxide-kafka
          $configHeader = Get-ChildItem -Path target -Recurse -Filter "config.h" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $configHeader) {
            Write-Error "Could not find librdkafka's generated config.h anywhere under target/"
            exit 1
          }
          Write-Host "Found config.h at $($configHeader.FullName)"
          $content = Get-Content $configHeader.FullName -Raw
          Write-Host "--- relevant defines ---"
          ($content -split "`r?`n") | Where-Object { $_ -match "WITH_SNAPPY|WITH_ZSTD|WITH_LZ4" } | ForEach-Object { Write-Host $_ }
          if ($content -notmatch "#define WITH_SNAPPY 1") {
            Write-Error "WITH_SNAPPY is not 1 in the generated config.h — Snappy-compressed topics will fail with 'Local: Not Implemented'"
            exit 1
          }
          if ($content -notmatch "#define WITH_ZSTD 1") {
            Write-Error "WITH_ZSTD is not 1 in the generated config.h — zstd-compressed topics will fail with 'Local: Not Implemented'"
            exit 1
          }
          Write-Host "Confirmed: both WITH_SNAPPY and WITH_ZSTD are 1 in the real generated config.h."

      - name: Install frontend dependencies
        run: npm install --prefix frontend

      - name: Build and upload to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ needs.check-version.outputs.tag }}
          releaseName: 'Offset Explorer Oxide v${{ needs.check-version.outputs.version }}'
          releaseDraft: true
          prerelease: false
