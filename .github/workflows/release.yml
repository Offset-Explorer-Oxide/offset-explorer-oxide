name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
      should_release: ${{ steps.check_tag.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from tauri.conf.json
        id: get_version
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          TAG="app-v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check if release tag already exists
        id: check_tag
        env:
          TAG: ${{ steps.get_version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists on origin — skipping release build (bump the version in src-tauri/tauri.conf.json to trigger a new release)."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} does not exist yet — will build and release."
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev

      - name: Verify CMake is available (Windows / rdkafka cmake-build)
        if: matrix.platform == 'windows-latest'
        run: cmake --version

      # librdkafka's CMake build (Windows only) locates zstd through
      # `find_package(ZSTD)`, and rdkafka-sys wires that up only via
      # `register_dep("zstd")` — unlike the sasl2/curl/zlib cases in the same
      # build script, it pushes no explicit include/lib path, and find_package
      # does not locate the Cargo-built zstd-sys library on this runner.
      # Installing zstd via vcpkg (already present on windows-latest) and
      # pointing CMAKE_PREFIX_PATH at it gives find_package a real library,
      # sidestepping that gap. The static triplet keeps zstd statically linked,
      # so end users still need nothing extra.
      #
      # Use `Add-Content`, not `>>`: PowerShell's `>>` writes UTF-16LE, which
      # the runner parses as UTF-8 — the write reports success while the
      # variable silently never reaches later steps. That cost us the v0.34.0
      # release.
      - name: Install zstd via vcpkg (Windows / rdkafka cmake-build zstd support)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          vcpkg install zstd:x64-windows-static
          Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static"

      # Every earlier attempt to verify this checked a *proxy* for codec
      # support — a Cargo feature resolving, a vcpkg install succeeding, an env
      # var being non-empty, a define sitting in a generated config.h, and most
      # recently a `cargo test` binary built from this same workspace. Each
      # reported green while the shipped Windows binary still could not
      # decompress: v0.37.0 passed the `build_info` gate and its installed
      # `kafkaoxide-app.exe` still carries librdkafka's "snappy not enabled at
      # build time" marker, which is only compiled in when Snappy is absent.
      #
      # So the checks below run in the order that matters: build the exact
      # binary tauri is about to bundle, make *it* answer, and only then upload
      # anything. A test binary is not the artifact; the artifact is.
      - name: Install frontend dependencies
        run: npm install --prefix frontend

      - name: Build the frontend (tauri embeds it into the binary)
        run: npm run build --prefix frontend

      # cmake-rs reads CMAKE_TOOLCHAIN_FILE — and every other variable it
      # consults — through a helper that prints the value and never emits
      # `cargo:rerun-if-env-changed` (grep the crate: it has none). So changing
      # which codecs librdkafka is compiled with invalidates nothing cargo
      # tracks, and the `target/` restored by the cache step above gets relinked
      # as-is. A stale CMake build tree compounds it, since CMake only honours a
      # toolchain file when it configures a tree for the first time. Both
      # failures are silent: the build succeeds and ships whatever codecs the
      # *cached* library happened to have, which is how a fix for this can land
      # in the repo and never reach the installer.
      #
      # Rebuilding librdkafka from scratch costs a few minutes per release and
      # removes the whole class of problem.
      - name: Rebuild librdkafka from scratch (its codec config is never cache-invalidated)
        run: cargo clean -p rdkafka-sys

      - name: Build the app binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      # Windows release builds have no console (`windows_subsystem = "windows"`),
      # so the report is read back from a file; the exit code is what fails the
      # job. See `report_librdkafka_features` in src-tauri/src/main.rs.
      - name: Verify the app binary itself decodes every codec
        shell: bash
        run: |
          set -euo pipefail
          binary=target/release/kafkaoxide-app
          if [ -f "$binary.exe" ]; then binary="$binary.exe"; fi
          status=0
          "$binary" --librdkafka-features "$RUNNER_TEMP/librdkafka-features.txt" || status=$?
          cat "$RUNNER_TEMP/librdkafka-features.txt"
          exit $status

      # Keeps the unit-level view too: it names *which* codec is missing in
      # terms of librdkafka's own feature list, and covers the non-bundled
      # crates' tests in the same run.
      - name: Verify librdkafka's own feature report
        run: cargo test --release -p kafkaoxide-kafka build_info -- --nocapture

      - name: Build and upload to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ needs.check-version.outputs.tag }}
          releaseName: 'Offset Explorer Oxide v${{ needs.check-version.outputs.version }}'
          releaseDraft: true
          prerelease: false
